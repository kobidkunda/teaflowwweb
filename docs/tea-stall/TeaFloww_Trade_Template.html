function t(en,bn){return locale==='bn'?bn:en}

function speak(words,lang=locale){let out=document.getElementById('voiceStatus');if(out&&modal.open&&!sheet.contains(out)){out.remove();out=null}if(!out){out=document.createElement('p');out.id='voiceStatus';out.className='small';out.setAttribute('role','status');(modal.open?sheet:document.getElementById('heroCopy')).append(out)}const synth=window.speechSynthesis, voice=synth?.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang));if(!voice){out.textContent=t('Voice playback is unavailable on this device.','এই ডিভাইসে অডিও শোনা যাচ্ছে না।');return}const u=new SpeechSynthesisUtterance(words);u.voice=voice;u.lang=voice.lang;synth.cancel();synth.speak(u);out.textContent=''}

function help(){return [[t('Will the tea reach my shop?','চা কি দোকানে পৌঁছবে?'),t('Your confirmed quote identifies shop delivery or the named collection depot.','দামের সঙ্গে দোকানে ডেলিভারি বা ডিপোর নাম জানানো হবে।')],[t('Can I pay on delivery?','ডেলিভারির সময় টাকা দিতে পারি?'),t('Available payment methods depend on your route and order.','আপনার রুট ও অর্ডার অনুযায়ী পেমেন্ট পদ্ধতি দেখানো হবে।')],[t('What comes in the trial?','স্যাম্পলে কী থাকে?'),t('The trial card lists the published kit contents and portion weights before checkout.','অর্ডারের আগে স্যাম্পল কার্ডে চায়ের নাম ও ওজন দেখুন।')],[t('How do I reorder?','আবার কীভাবে অর্ডার করব?'),t('Use your pack or invoice link to check the current stock and price again.','প্যাক বা ইনভয়েসের লিঙ্ক থেকে স্টক ও আজকের দাম দেখে নিন।')]].map(([q,a])=>'<details><summary>'+q+'</summary><p>'+a+'</p></details>').join('')}
function render(){document.documentElement.lang=locale;app.innerHTML='<header><div class="wrap nav"><a class="brandlink" href="#top"><span class="logo">TeaFloww</span><span class="trade">'+t('For tea shops','চায়ের দোকানের জন্য')+'</span></a><nav class="navlinks"><a href="#trial">'+t('Trial kit','স্যাম্পল কিট')+'</a><a href="#bulk">'+t('Bulk supply','পাইকারি চা')+'</a><a href="#cost">'+t('Cost per glass','প্রতি গ্লাসের খরচ')+'</a></nav><button class="pill langbtn" data-act="lang">'+icon('globe')+langNames[locale]+' ▾</button></div></header><main id="top" class="wrap"><section class="hero"><div id="heroCopy">'+over('Siliguri · Tea for your counter','শিলিগুড়ি · আপনার দোকানের চা')+'<h1>'+t('Try it in the chai you serve <em>every day.</em>','রোজ দোকানে যে চা বানান, <em>সেই চায়েই পরখ করুন।</em>')+'</h1><p class="intro">'+t('Use your own milk and measure. Taste a trial at your counter, or check what a full pack costs at your shop.','আপনার দোকানের দুধ আর চায়ের মাপেই বানিয়ে দেখুন। স্যাম্পল নিন অথবা বড় প্যাকের দাম ও ডেলিভারি দেখুন।')+'</p><div class="actions">'+link(t('Try a sample','স্যাম্পল দেখুন')+' '+icon('arrow'),'trial')+link(t('Check bulk price','পাইকারি দাম দেখুন'),'bulk','soft')+'</div><button class="textbutton" data-act="listen">'+icon('speaker')+' '+speechLabel()+'</button></div><div class="heroimage"><img src="'+pictures.hero+'" alt="'+t('Milk chai pouring through a strainer into a cutting glass, illustrative image','ছাঁকনি দিয়ে গ্লাসে দুধ চা ঢালার নমুনা ছবি')+'"><button class="cap" data-act="brew">'+icon('cup')+' '+t('See the brew guide','চা বানানোর মাপ দেখুন')+'</button></div></section><section class="section trial" id="trial"><div class="trialphoto"><img src="'+pictures.trial+'" alt="'+t('Trial kit concept with four kraft sample pouches and cups of tea','চারটি নমুনা প্যাক ও চায়ের কাপ')+'"></div><div class="copy">'+over('The trial kit','চায়ের স্যাম্পল')+'<h2>'+t('Try it during your next tea shift.','পরের বারের চায়ে পরখ করে দেখুন।')+'</h2><p>'+t('Make one pan the way you usually do. Compare colour, strength and taste before choosing a bulk pack.','রোজ যেভাবে চা বানান, সেভাবেই একবার বানান। রং, কড়াভাব আর স্বাদ মিলিয়ে বড় প্যাক বেছে নিন।')+'</p>'+btn(t('See trial & delivery','স্যাম্পল ও ডেলিভারি দেখুন')+' '+icon('arrow'),'trial','soft')+'</div></section><section class="section" id="bulk"><div class="title"><div>'+over('Bulk supply','পাইকারি চা')+'<h2>'+t('What will tea cost at your shop?','আপনার দোকানে চা পৌঁছতে কত লাগবে?')+'</h2></div></div><div class="grid"><form id="quoteForm" class="panel"><label for="blend">'+t('Choose your tea','চা বেছে নিন')+'</label><select id="blend">'+(locale==='bn'?bengaliNames:names).map((n,i)=>'<option value="'+i+'" '+(i===blend?'selected':'')+'>'+n+'</option>').join('')+'</select><div class="columns"><div><div class="label">'+t('Pack size','প্যাকের ওজন')+'</div><div class="rail">'+Object.keys(prices).map(k=>'<button type="button" class="choice" data-pack="'+k+'" aria-pressed="'+(pack===+k)+'">'+kg(k)+'</button>').join('')+'</div></div><div><div class="label">'+t('Packs','প্যাক সংখ্যা')+'</div><div class="counter"><button type="button" data-qty="-1" aria-label="'+t('Fewer packs','প্যাক কমান')+'">−</button><output id="qnum">'+number(qty)+'</output><button type="button" data-qty="1" aria-label="'+t('More packs','প্যাক বাড়ান')+'">+</button></div></div></div><label for="pin">'+t('Shop PIN code','দোকানের পিনকোড')+'</label><div class="inputrow"><input required id="pin" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[1-9][0-9]{5}" placeholder="734001" value="'+pin+'"><button class="btn primary">'+t('Check delivery','ডেলিভারি দেখুন')+'</button></div><p class="small">'+t('Preview PINs: 734001 doorstep · 700001 depot. Other PINs open an enquiry.','নমুনা পিন: 734001 দোকানে · 700001 ডিপোতে। অন্য পিনে খোঁজ নিন।')+'</p></form><div class="panel ticket" id="ticket" aria-live="polite"></div></div></section><section class="section" id="cost"><div class="title"><div>'+over('At the counter','দোকানের হিসাব')+'<h2>'+t('What goes into one glass?','এক গ্লাসে চায়ের খরচ কত?')+'</h2></div><p>'+t('Tea leaves only. Use two batches you would actually serve.','শুধু চা পাতার খরচ। দোকানে বানানো দুই ব্যাচের মাপ দিন।')+'</p></div><div class="pair">'+calcPanel(0)+calcPanel(1)+'</div></section><section class="section help" id="help"><div>'+over('Shop owner support','দোকানদারদের সহায়তা')+'<h2>'+t('Ask TeaFloww.','TeaFloww-কে জিজ্ঞেস করুন।')+'</h2>'+btn(t('Prepare a WhatsApp enquiry','হোয়াটসঅ্যাপ বার্তা লিখুন'),'enquire','soft')+'</div><div>'+help()+'</div></section></main><footer><div class="wrap"><span class="logo">TeaFloww</span><span class="mini">'+t('Trade design preview · Siliguri','ট্রেড ডিজাইনের নমুনা · শিলিগুড়ি')+'</span></div></footer><div class="sticky" id="sticky"></div>';ticket();calc();sticky()}
function handover(){return pin==='734001'?t('Delivery to your shop','দোকানে ডেলিভারি'):t('Collect from the example depot · local collection cost extra','নমুনা ডিপো থেকে সংগ্রহ · স্থানীয় খরচ আলাদা')}
function ticket(){let box=document.querySelector('#ticket');let tea=prices[pack]*qty;let head=demo()+'<h3>'+t('Your delivery estimate','আপনার ডেলিভারির হিসাব')+'</h3><p>'+blendName()+' · '+number(qty)+' × '+kg(pack)+'</p><hr>';if(quote==='ok'){box.innerHTML=head+row(t('Tea','চা'),money(tea))+row(t('Example freight','নমুনা পরিবহন খরচ'),money(900))+'<hr><div class="amount">'+money(tea+900)+'</div><b>'+money((tea+900)/(pack*qty))+t(' / kg',' / কেজি')+'</b><p>'+handover()+' · '+pin+'</p>'+btn(t('Review this pack','প্যাকের হিসাব দেখুন')+' '+icon('arrow'),'review')+((qty===1&&pack!==10)?'<button class="textbutton" data-act="compare">'+t('Compare 5 kg and 25 kg','৫ ও ২৫ কেজির তুলনা')+'</button>':'');}
else if(quote==='manual'){box.innerHTML=head+'<h3>'+t('Ask for a transport quote.','পরিবহন খরচ জেনে নিন।')+'</h3><p>'+t('The team needs to confirm the price and handover point for this selection.','এই অর্ডারের দাম ও চা কোথায় পাবেন, তা নিশ্চিত করা প্রয়োজন।')+'</p>'+btn(t('Prepare enquiry','বার্তা লিখুন'),'enquire');}
else{box.innerHTML=head+row(t('Tea subtotal','চায়ের দাম'),money(tea))+'<div class="amount">'+kg(pack*qty)+'</div><p>'+t('Enter your PIN to see the freight, handover point and total.','পিনকোড দিয়ে পরিবহন খরচ, সংগ্রহের স্থান এবং মোট দাম দেখুন।')+'</p>'}sticky()}
function trial(){show(t('Your counter trial','আপনার দোকানের স্যাম্পল'),demo()+'<p>'+t('Example discovery kit · 4 × 50 g. Illustrative selection: Everyday Strong, Elaichi, Ginger and Masala.','নমুনা কিট · ৪ × ৫০ গ্রাম। উদাহরণ হিসেবে এভরিডে স্ট্রং, এলাচ, আদা ও মশলা চা।')+'</p>'+row(t('Illustrative kit price','উদাহরণ দাম'),money(200))+'<form id="trialForm"><label for="trialPin">'+t('Shop PIN code','দোকানের পিনকোড')+'</label><input required id="trialPin" inputmode="numeric" pattern="[1-9][0-9]{5}" maxlength="6" placeholder="734001" value="'+trialPin+'"><button class="btn primary">'+t('Check trial delivery','স্যাম্পল ডেলিভারি দেখুন')+'</button></form><p class="small">'+t('Try 734001 for the sample parcel route.','নমুনা পার্সেল রুটের জন্য 734001 লিখুন।')+'</p><div id="trialResult" aria-live="polite"></div>')}
function review(){let total=qty*prices[pack]+900;show(t('Review your pack','প্যাকের হিসাব'),demo()+row(blendName(),kg(pack*qty))+row(t('Tea','চা'),money(qty*prices[pack]))+row(t('Freight','পরিবহন'),money(900))+'<hr>'+row(t('Total · due now','মোট · এখন দিতে হবে'),money(total))+row(t('Due later','পরে দিতে হবে'),money(0))+'<p>'+handover()+' · '+pin+'</p><p class="hint">'+t('Preview checkout ends here. No payment is taken.','নমুনা চেকআউট এখানে শেষ। কোনো টাকা নেওয়া হবে না।')+'</p>'+btn(t('Back to quote','হিসাবে ফিরুন'),'close','soft'))}
function compare(){show(t('Compare the full outlay','মোট খরচের তুলনা'),demo()+[5,25].map(k=>'<h3>'+kg(k)+'</h3>'+row(t('Tea + freight','চা + পরিবহন'),money(prices[k])+' + '+money(900))+row(t('Total','মোট'),money(prices[k]+900))+row(t('Freight per kg','প্রতি কেজির পরিবহন'),money(900/k))+row(t('Total per kg','প্রতি কেজির মোট'),money((prices[k]+900)/k))).join('<hr>')+'<p>'+handover()+'</p>')}
function enquiry(isTrial=false){let dest=(isTrial?trialPin:pin)||'______';let what=isTrial?t('a trial kit','স্যাম্পল কিট'):kg(pack*qty)+' '+blendName();show(t('Your WhatsApp draft','আপনার হোয়াটসঅ্যাপ বার্তা'),'<label for="draft">'+t('Edit your message','বার্তা বদলে নিন')+'</label><textarea id="draft" rows="6">'+t('My shop PIN is ','আমার দোকানের পিন ')+dest+t('. I am interested in ', '। আমি নিতে চাই ')+what+t('. Please confirm the total and whether it comes to my shop or a depot. I prefer English.','। দয়া করে মোট খরচ ও দোকানে না ডিপোতে পাব জানাবেন। বাংলায় উত্তর চাই।')+'</textarea><p class="hint">'+t('Draft preview. Your message stays on this device.','নমুনা বার্তা। আপনার বার্তা এই ডিভাইসেই আছে।')+'</p>'+btn(t('Done','হয়েছে'),'close','soft'))}
function sticky(){let s=document.querySelector('#sticky');if(!s)return;let b=document.getElementById('bulk').getBoundingClientRect(), tr=document.getElementById('trial').getBoundingClientRect(), edit=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);let bulk=b.top<innerHeight*.6&&b.bottom>80,trialHere=tr.top<innerHeight*.6&&tr.bottom>80;s.classList.toggle('active',!modal.open&&!edit&&(bulk||trialHere));let markup=bulk?(quote==='ok'?btn(t('Continue · ','এগিয়ে যান · ')+money(qty*prices[pack]+900),'review'):quote==='manual'?btn(t('Prepare enquiry','বার্তা লিখুন'),'enquire'):btn(t('Check bulk delivery','ডেলিভারি দেখুন'),'focusPin')):btn(t('Check trial delivery','স্যাম্পল ডেলিভারি দেখুন'),'trial');if(s.dataset.markup!==markup){s.innerHTML=markup;s.dataset.markup=markup}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.locale){locale=b.dataset.locale;picked=true;try{localStorage.setItem('tf_design_lang',locale)}catch{}modal.close();render();document.querySelector('.langbtn').focus();return}if(b.dataset.say){speak(langNames[b.dataset.say],b.dataset.say);return}if(b.dataset.pack||b.dataset.qty){if(b.dataset.pack)pack=+b.dataset.pack;else qty=Math.min(99,Math.max(1,qty+Number(b.dataset.qty)));quote=null;document.querySelectorAll('[data-pack]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.pack===pack));document.getElementById('qnum').textContent=number(qty);ticket();return}switch(b.dataset.act){case 'lang':languages();break;case 'close':modal.close();break;case 'listen':speak(document.getElementById('heroCopy').querySelector('.intro').textContent);break;case 'brew':
  show(t('Brew a test pan','এক প্যান চা বানিয়ে দেখুন'),
    '<p>Everyday Strong Milk Chai</p>'+
    row(t('Tea','চা'),t('3 g','৩ গ্রাম'))+
    row(t('Water + milk','জল + দুধ'),t('120 ml + 80 ml','১২০ মিলি + ৮০ মিলি'))+
    row(t('Simmer after adding tea','চা দিয়ে ফুটিয়ে নিন'),t('3–4 min','৩–৪ মিনিট'))+
    '<p>'+t('Strain and taste. Use the same milk and measure when comparing batches.','ছেঁকে স্বাদ দেখুন। তুলনার জন্য একই দুধ ও মাপ ব্যবহার করুন।')+'</p>'+
    '<p class="small">'+t('Catalogue brew guide. The hero image illustrates the intended shoot.','ক্যাটালগের চা বানানোর নির্দেশ। উপরের ছবিটি নমুনা।')+'</p>');
  break;
case 'trial':trial();break;case 'review':review();break;case 'compare':compare();break;case 'focusPin':document.getElementById('pin').focus();break;case 'enquire':enquiry();break;case 'trialEnquiry':enquiry(true);break;}})
document.addEventListener('input',e=>{if(e.target.id==='pin'){pin=e.target.value.replace(/[^0-9]/g,'');e.target.value=pin;quote=null;ticket()}if(e.target.id==='trialPin'){trialPin=e.target.value.replace(/[^0-9]/g,'');e.target.value=trialPin;document.getElementById('trialResult').innerHTML=''}if(e.target.dataset.c!==undefined){calcValues[+e.target.dataset.c]=e.target.value;calc()}})
document.addEventListener('change',e=>{if(e.target.id==='blend'){blend=+e.target.value;quote=null;ticket()}})
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='quoteForm'){quote=['734001','700001'].includes(pin)&&pack*qty+.6<=30?'ok':'manual';ticket();document.activeElement?.blur();if(innerWidth<=760)document.getElementById('ticket').scrollIntoView({block:'center'})}if(e.target.id==='trialForm'){document.getElementById('trialResult').innerHTML=trialPin==='734001'?'<hr>'+row(t('Prepaid total incl. delivery','ডেলিভারি সহ প্রিপেইড মোট'),money(200))+'<p>'+t('Sample doorstep delivery','নমুনা দোকান ডেলিভারি')+' · '+trialPin+'</p>'+btn(t('Finish preview','নমুনা দেখা শেষ'),'close','soft'):btn(t('Request trial quote','স্যাম্পলের খরচ জিজ্ঞেস করুন'),'trialEnquiry')}})
document.addEventListener('focusin',sticky);document.addEventListener('focusout',()=>setTimeout(sticky,0));addEventListener('scroll',sticky,{passive:true});modal.addEventListener('close',sticky);const routeLang=new URLSearchParams(location.search).get('lang');try{let saved=routeLang||localStorage.getItem('tf_design_lang');if(Object.hasOwn(langNames,saved)){locale=saved;picked=true}}catch{}render();if(!picked)languages();
</script></body></html>

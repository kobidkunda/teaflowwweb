openapi: 3.1.0
info:
  title: TeaFloww Blend Lab — proposed API contracts
  version: '0.1.0-draft'
  description: |
    Illustrative request/response shapes only. NOT implemented. Adapt to existing
    storefront auth, gateway, resource permissions, framework and TeaPilot capabilities.
servers:
  - url: https://teafloww.com
paths:
  /api/blend-lab/plans:
    get:
      summary: Public service catalog with approved plan versions and exclusions
      responses:
        '200':
          description: Plan catalog including confirmed tax-inclusive displayed totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans: {type: array, items: {$ref: '#/components/schemas/Plan'}}
  /api/blend-lab/coverage:
    post:
      summary: Validate a customer's actual inbound sample courier eligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pincode, country, planCode]
              properties:
                pincode: {type: string, pattern: '^[0-9]{6}$'}
                country: {type: string, enum: [IN]}
                planCode: {$ref: '#/components/schemas/PlanCode'}
      responses:
        '200':
          description: Serviceability and restrictions with no implied booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Coverage'}
  /api/blend-lab/projects:
    post:
      summary: Create a validated project draft and reserve immutable price/terms snapshot
      security: [{customerSession: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 12, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: Draft created — not a paid order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectSummary'}
        '422': {description: Validation or courier policy rejection}
  /api/blend-lab/projects/{publicId}:
    get:
      summary: Customer-safe project view with entitlement restrictions
      security: [{customerSession: []}]
      parameters:
        - in: path
          name: publicId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Authorized owner-facing project summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectSummary'}
        '404': {description: Unknown or inaccessible project}
  /api/blend-lab/projects/{publicId}/feedback:
    post:
      summary: Submit verified customer feedback for an eligible trial version
      security: [{customerSession: []}]
      parameters:
        - in: path
          name: publicId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formulationVersionPublicRef, decision]
              properties:
                formulationVersionPublicRef: {type: string}
                decision: {type: string, enum: [approve, request_revision]}
                notes: {type: string, maxLength: 5000}
      responses:
        '202': {description: Feedback accepted subject to entitlement and state guards}
        '409': {description: Revision exhausted or project not in feedback stage}
  /api/blend-lab/projects/{publicId}/report/{version}/download:
    get:
      summary: Authorize a specific published report version and redirect to expiring signed URL
      security: [{customerSession: []}]
      parameters:
        - in: path
          name: publicId
          required: true
          schema: {type: string}
        - in: path
          name: version
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '302': {description: Authorized short-lived private download link}
        '403': {description: Missing permission or plan entitlement}
        '404': {description: No published report version}
  /api/blend-lab/payments/provider-webhook:
    post:
      summary: Provider-specific signed webhook (no customer auth)
      description: Verify raw body signature, event replay and matching server amount before any payment transition.
      responses:
        '200': {description: Accepted or safely deduplicated}
        '400': {description: Invalid signature/event}
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: existing-session-cookie
      description: Placeholder; replace with real store auth.
  schemas:
    PlanCode:
      type: string
      enum: [MATCH_QUOTE, QUALITY_AUDIT, SIGNATURE]
    Plan:
      type: object
      required: [code, version, totalPaise, currency, title, features]
      properties:
        code: {$ref: '#/components/schemas/PlanCode'}
        version: {type: integer}
        title: {type: string}
        totalPaise: {type: integer}
        currency: {type: string, const: INR}
        inclusiveTaxConfirmed: {type: boolean}
        features: {type: array, items: {type: string}}
        exclusions: {type: array, items: {type: string}}
    Coverage:
      type: object
      required: [serviceable, includedInPrice, restrictions]
      properties:
        serviceable: {type: boolean}
        includedInPrice: {type: boolean}
        restrictions: {type: array, items: {type: string}}
        manualAlternativeAvailable: {type: boolean}
    ProjectCreate:
      type: object
      required: [planCode, tea, goals, contact, pickupAddress, acceptedTermsVersion]
      properties:
        planCode: {$ref: '#/components/schemas/PlanCode'}
        tea:
          type: object
          properties:
            category: {type: string, enum: [CTC, orthodox, green, flavoured, other, unknown]}
            knownGrade: {type: string}
            currentPricePaisePerKg: {type: integer, minimum: 0}
        goals: {type: array, minItems: 1, items: {type: string}}
        contact:
          type: object
          required: [name, email, phone]
          properties:
            name: {type: string}
            email: {type: string, format: email}
            phone: {type: string}
        pickupAddress:
          type: object
          required: [line1, city, state, pincode, country]
          properties:
            line1: {type: string}
            city: {type: string}
            state: {type: string}
            pincode: {type: string}
            country: {type: string, const: IN}
        acceptedTermsVersion: {type: string}
    ProjectSummary:
      type: object
      required: [publicId, planCode, totalPaise, paymentState, workflowState]
      properties:
        publicId: {type: string}
        planCode: {$ref: '#/components/schemas/PlanCode'}
        totalPaise: {type: integer}
        paymentState: {type: string}
        workflowState: {type: string}
        nextAction: {type: string}
        reportAvailable: {type: boolean}
        quoteAvailable: {type: boolean}
